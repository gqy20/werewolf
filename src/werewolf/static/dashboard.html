<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werewolf Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --cyan:#58a6ff;--red:#f85149;--amber:#d29922;--green:#3fb950;
  --text:#c9d1d9;--text-dim:#8b949e;
  --radius:6px
}
html{font-size:14px;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  min-height:100vh;line-height:1.5}

.app{max-width:1200px;margin:0 auto;padding:16px}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;margin-bottom:16px;border-bottom:2px solid var(--border)}
.header h1{font-size:1.1rem;font-weight:700;color:var(--text)}
.header h1 span{color:var(--text-dim);font-weight:400;font-size:.85rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;
  font-size:.75rem;font-weight:600;letter-spacing:.04em}
.badge-day{background:rgba(63,185,80,.15);color:var(--green)}
.badge-night{background:rgba(210,153,34,.15);color:var(--amber)}
.badge-setup{background:rgba(139,148,158,.15);color:var(--text-dim)}
.stat{font-size:.78rem;color:var(--text-dim)}

/* players */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px;margin-bottom:16px}
.card{padding:12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);transition:border-color .15s}
.card:hover{border-color:var(--text-dim)}
.card.dead{opacity:.5}
.name{font-weight:600;font-size:.85rem;margin-bottom:4px}
.role{font-size:.72rem;color:var(--text-dim);margin-bottom:6px}
.tag{display:inline-block;font-size:.65rem;padding:1px 8px;border-radius:99px;font-weight:600}
.tag-alive{color:var(--green);background:rgba(63,185,80,.12)}
.tag-dead{color:var(--red);background:rgba(248,81,73,.12)}

/* timeline */
.timeline{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);max-height:500px;overflow-y:auto}
.tl-head{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:.82rem}
.tl-count{font-size:.7rem;color:var(--text-dim);font-weight:400}
.entry{padding:8px 14px;border-bottom:1px solid var(--border);font-size:.76rem;display:flex;gap:8px}
.entry:last-child{border-bottom:none}
.ts{flex-shrink:0;color:var(--text-dim);font-size:.68rem;font-family:monospace}
.ev{font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
  min-width:52px}
.ev-speak{color:var(--green)}.ev-vote{color:var(--amber)}
.ev-verdict{color:var(--red)}.ev-night{color:var(--amber)}
.ev-over{color:var(--cyan)}.ev-role{color:var(--cyan)}
.detail{color:var(--text)}

.empty{text-align:center;padding:40px 0;color:var(--text-dim)}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .header{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>Werewolf <span>// Game Monitor</span></h1>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="badge badge-setup" id="phase-badge">INIT</span>
      <span class="stat" id="round-info">Round -</span>
      <span class="stat" id="alive-info">0/0</span>
    </div>
  </header>

  <section class="grid" id="players"></section>

  <section class="timeline">
    <div class="tl-head"><span>Event Log</span><span class="tl-count" id="log-count">0</span></div>
    <div id="log"><div class="empty">Waiting for game data...</div></div>
  </section>
</div>

<script>
const ROLE_MAP={werewolf:'\u{1F43A} Wolf',villager:'\u{1F464} Villager',
  seer:'\u{1F52E} Seer',witch:'\u{1F9A8} Witch',hunter:'\u{1F42B} Hunter',guard:'\u{1F6E1} Guard'};
const PHASE_MAP={SETUP:'准备',DAY_SPEAK:'白天·发言',DAY_VOTE:'白天·投票',
  NIGHT:'夜晚',ENDED:'结束'};
const EV_MAP={role_assigned:'ROLE',speak:'SPEAK',vote:'VOTE',
  vote_result:'VERDICT',wolf_action:'WOLF',seer_check:'SEER',
  guard_action:'GUARD',witch_action:'WITCH',night_resolve:'NIGHT',
  hunter_shoot:'SHOOT',game_end:'END',day_start:'DAWN',night_start:'DUSK'};

let lastTs='';
const POLL=3000;

async function api(u){try{return await(await fetch(u)).json()}catch(e){return null}}

function fmt(state){
  if(!state)return;
  const ph=(state.phase||'').toUpperCase();
  const pb=document.getElementById('phase-badge');
  pb.textContent=PHASE_MAP[ph]||ph;
  pb.className='badge'+(ph.includes('NIGHT')?' badge-night':ph.includes('DAY')?' badge-day':' badge-setup');
  document.getElementById('round-info').textContent='Day '+(state.round||'?');
  const alive=(state.alive||[]).length,total=Object.keys(state.roles||{}).length;
  document.getElementById('alive-info').textContent=alive+'/'+total;

  const g=document.getElementById('players');g.innerHTML='';
  for(const[n,r]of Object.entries(state.roles||{})){
    const ok=(state.alive||[]).includes(n);
    const d=document.createElement('div');
    d.className='card'+(ok?'':' dead');
    d.innerHTML=`<div class="name">${n}</div><div class="role">${ROLE_MAP[r.role]||r.role}</div>
      <span class="tag ${ok?'tag-alive':'tag-dead'}">${ok?'存活':'出局'}</span>`;
    g.appendChild(d);
  }
}

function detail(e){
  const ev=e.event;
  if(ev==='speak')return`<b>${e.player}</b>: ${e.msg||''}`;
  if(ev==='vote')return`${e.voter} → ${e.target||'-'}`;
  if(ev==='vote_result')return e.executed?`\u{1F480} <b>${e.executed}</b> 被处决`:'平票/弃票';
  if(ev==='wolf_action')return`狼人刀向 <b>${e.target||'?'}</b>`;
  if(ev==='seer_check')return`${e.player||''}查验 <b>${e.target||'?'}</b> → ${e.result||'?'}`;
  if(ev==='witch_action'){if(!e.action)return'-';return e.action==='save'?'使用解药':'使用毒药'+(e.target?` <b>${e.target}</b>`:'')}
  if(ev==='guard_action')return e.target?`守护 <b>${e.target}</b>`:'空守';
  if(ev==='night_resolve'){
    const p=[];
    if(e.deaths&&e.deaths.length)p.push(`死亡: ${e.deaths.join(', ')}`);
    if(e.saved)p.push('被救');
    if(e.poisoned)p.push(`中毒: ${e.poisoned}`);
    return p.length?p.join(' | '):'\u{1F304} 平安夜';
  }
  if(ev==='hunter_shoot')return`${e.hunter}开枪带走了 <b>${e.target}</b>`;
  if(ev==='game_end')return`<b>${e.result||''}</b>`;
  if(ev==='role_assigned'){
    const r=e.roles||{};return Object.entries(r).map(([k,v])=>`${k}:${v}`).join(', ');
  }
  return Object.entries(e).filter(([k])=>!['event','ts','round','phase'].includes(k))
    .map(([k,v])=>k+'='+v).join(' ');
}

function renderLogs(entries){
  const c=document.getElementById('log');
  if(!entries||!entries.length){c.innerHTML='<div class="empty">暂无事件</div>';return}
  const frag=document.createDocumentFragment();
  entries.slice().reverse().forEach(e=>{
    const d=document.createElement('div');d.className='entry';
    const ts=(e.ts||'').substring(11,16)||'--:--';
    const ev=e.event||'?';
    const cls=ev==='speak?'ev-speak':ev==='vote'||ev==='vote_result'?'ev-verdict':
      ev==='night_resolve'||ev==='night_start'?'ev-night':
      ev==='game_end'?'ev-over':'ev-role';
    d.innerHTML=`<span class="ts">${ts}</span><span class="ev ${cls}">${EV_MAP[ev]||ev}</span><span class="detail">${detail(e)}</span>`;
    frag.appendChild(d);
  });
  c.appendChild(frag);
  document.getElementById('log-count').textContent=
    document.querySelectorAll('.entry').length+' 条';
}

async function poll(){
  const [st,logs]=await Promise.all([api('/api/state'),api('/api/log?since='+encodeURIComponent(lastTs))]);
  if(st)fmt(st);
  if(logs&&logs.length){renderLogs(logs);lastTs=logs[logs.length-1].ts||lastTs}
  setTimeout(poll,POLL);
}

poll();
</script>
</body>
</html>
