[project]
name = "werewolf"
version = "0.1.0"
description = "Claude Code 狼人杀 Game Master"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.packages]
src = "src"

[project.scripts]
werewolf = "werewolf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
